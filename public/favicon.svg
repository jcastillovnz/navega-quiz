<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#22d3ee" stroke-width="2"/>
  <!-- Ancla estilizada -->
  <g transform="translate(32 32)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anillo superior -->
    <circle cx="0" cy="-14" r="3.5" fill="#22d3ee"/>
    <!-- Asta -->
    <line x1="0" y1="-10" x2="0" y2="14"/>
    <!-- Travesaño -->
    <line x1="-9" y1="-7" x2="9" y2="-7"/>
    <!-- Brazos curvos -->
    <path d="M -16 8 Q -16 18, 0 18 Q 16 18, 16 8" />
  </g>
  <!-- Brillo -->
  <circle cx="22" cy="20" r="3" fill="#22d3ee" opacity="0.5"/>
</svg>
